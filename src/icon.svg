<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!-- Recranet Redirects plugin icon: URL card with a retired source URL, a
	     connector to the new target URL and a redirect button, on a rounded
	     gradient tile -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2f6df6"/>
			<stop offset="1" stop-color="#1e4fd6"/>
		</linearGradient>
		<linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#34d399"/>
			<stop offset="1" stop-color="#0ea371"/>
		</linearGradient>
	</defs>

	<!-- tile -->
	<rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

	<!-- URL card, slightly rotated for life -->
	<g transform="rotate(-3 256 256)">
		<rect x="112" y="88" width="288" height="336" rx="28" fill="#ffffff"/>
		<rect x="112" y="88" width="288" height="336" rx="28" fill="none" stroke="#0b2b78" stroke-opacity=".08" stroke-width="4"/>

		<!-- title bar -->
		<rect x="148" y="126" width="150" height="20" rx="10" fill="#1e2a44"/>

		<!-- source URL: retired (struck through) -->
		<rect x="148" y="176" width="70" height="12" rx="6" fill="#8b97ad"/>
		<rect x="148" y="196" width="216" height="34" rx="10" fill="#eef2f8"/>
		<rect x="160" y="208" width="120" height="10" rx="5" fill="#5b6a88"/>
		<rect x="152" y="211" width="150" height="4" rx="2" fill="#ef4444"/>

		<!-- connector: source redirects to target -->
		<g fill="none" stroke="#0ea371" stroke-width="6" stroke-linecap="round">
			<path d="M132 213v44"/>
		</g>
		<path fill="#0ea371" d="m132 274-10-18h20z"/>

		<!-- target URL: active (blue ring) -->
		<rect x="148" y="246" width="96" height="12" rx="6" fill="#8b97ad"/>
		<rect x="148" y="266" width="216" height="34" rx="10" fill="#ffffff" stroke="#2f6df6" stroke-width="5"/>
		<rect x="162" y="277" width="120" height="10" rx="5" fill="#2f6df6"/>

		<!-- redirect button with branching arrow, kept inside the button bounds -->
		<rect x="148" y="330" width="216" height="52" rx="14" fill="url(#btn)"/>
		<g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round">
			<path d="M226 368h22c15 0 27-12 27-27v-6"/>
		</g>
		<path fill="#ffffff" d="m275 320 15 26h-30z"/>
	</g>
</svg>
